# ---------------------------------------------------------------------------
# ГЛОБАЛЬНЫЕ НАСТРОЙКИ ПРОЦЕССА HAPROXY
# ---------------------------------------------------------------------------
global
  log stdout format raw local0 # Вывод логов в стандартный поток Docker (видно через docker logs)
  maxconn 2048                 # Максимальное количество одновременных соединений

# ---------------------------------------------------------------------------
# НАСТРОЙКИ ПО УМОЛЧАНИЮ ДЛЯ ВСЕХ СЕКЦИЙ
# ---------------------------------------------------------------------------
defaults
  log global
  mode http                    # Работа на уровне HTTP/HTTPS (L7) для анализа заголовков и статусов здоровья
  option httplog               # Расширенный формат логирования HTTP-запросов
  option dontlognull           # Не засорять логи пустыми проверками подключения без передачи данных
  timeout connect 5s           # Таймаут ожидания установки соединения с нодой Vault
  timeout client  30s          # Таймаут неактивности со стороны клиента
  timeout server  30s          # Таймаут ожидания ответа от сервера Vault

# ---------------------------------------------------------------------------
# ВЕБ-ПАНЕЛЬ СТАТИСТИКИ (Мониторинг состояния кластера)
# ---------------------------------------------------------------------------
listen stats
  # Порт веб-интерфейса статистики
  bind *:8404 ssl crt /usr/local/etc/haproxy/certs/vault.pem                 
  stats enable                 # Включение страницы статистики
  stats uri /stats             # Адрес страницы: http://<HOST_IP>:8404/stats
  stats refresh 5s             # Автоматическое обновление страницы каждые 5 секунд

# ---------------------------------------------------------------------------
# FRONTEND: ЕДИНАЯ ТОЧКА ВХОДА В КЛАСТЕР VAULT
# ---------------------------------------------------------------------------
frontend vault_front
  # Принимаем HTTPS-трафик на порту 8200 с использованием объединенного сертификата и ключа (vault.pem)
  bind *:443 ssl crt /usr/local/etc/haproxy/certs/vault.pem
  # Весь входящий трафик направляем в пул серверов vault_back
  default_backend vault_back

# ---------------------------------------------------------------------------
# BACKEND: ПУЛ НОД VAULT И ПРОВЕРКА АКТИВНОГО ЛИДЕРА
# ---------------------------------------------------------------------------
backend vault_back
  balance roundrobin
  # Запрашиваем эндпоинт состояния Vault. Код 200 отдаст ТОЛЬКО распечатанный активный лидер (Leader).
  # Ноды в режиме Standby (код 429) и Sealed (код 503) автоматически помечаются как DOWN.
  option httpchk GET /v1/sys/health
  http-check expect status 200

  # Список серверов кластера с шифрованием трафика до бэкенда (SSL), проверкой сертификата по ca.crt и передачей SNI
  server vault1 vault1.192.168.87.55.nip.io:8200 check check-ssl verify required ca-file /usr/local/etc/haproxy/certs/ca.crt ssl sni str(vault1.192.168.87.55.nip.io) inter 2s fall 2 rise 2 init-addr last,libc,none
  server vault2 vault2.192.168.87.55.nip.io:8200 check check-ssl verify required ca-file /usr/local/etc/haproxy/certs/ca.crt ssl sni str(vault2.192.168.87.55.nip.io) inter 2s fall 2 rise 2 init-addr last,libc,none
  server vault3 vault3.192.168.87.55.nip.io:8200 check check-ssl verify required ca-file /usr/local/etc/haproxy/certs/ca.crt ssl sni str(vault3.192.168.87.55.nip.io) inter 2s fall 2 rise 2 init-addr last,libc,none
