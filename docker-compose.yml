# Секция определения всех сервисов (контейнеров), которые входят в проект
services:
  
  # ---------------------------------------------------------------------------
  # 1. СЕРВИС ГЕНЕРАЦИИ СЕРТИФИКАТОВ И КОНФИГОВ (одноразовый контейнер)
  # ---------------------------------------------------------------------------
  cert-gen:
    # Образ Alpine Linux; версия подставляется из файла .env (переменная ALPINE_VERSION)
    image: alpine:${ALPINE_VERSION}
    # Фиксированное имя контейнера для удобства просмотра логов
    container_name: vault-cert-gen
    # Переменные окружения, передаваемые внутрь контейнера
    environment:
      - HOST_IP=${HOST_IP} # IP-адрес хоста (берется из .env) для формирования доменов nip.io
    # Подключение папок и файлов с вашего компьютера внутрь контейнера (volumes)
    volumes:
      - ./certs:/certs                               # Папка, куда скрипт сохранит сгенерированные сертификаты
      - ./generate-certs.sh:/generate-certs.sh:ro    # Скрипт генерации (:ro означает "только для чтения")
      - ./vault.hcl.tpl:/vault.hcl.tpl:ro            # Шаблон конфигурации Vault (только для чтения)
      - ./haproxy.cfg.tpl:/haproxy.cfg.tpl:ro        # Шаблон конфигурации HAProxy (только для чтения)
      - ./:/configs                                  # Корневая папка проекта, куда скрипт положит готовые конфиги для нод
    # Команда, которая выполнится при старте контейнера
    command: /bin/sh /generate-certs.sh
    # Подключение контейнера к внутренней виртуальной сети
    networks:
      - vault-net

  # ---------------------------------------------------------------------------
  # 1.5. ВСПОМОГАТЕЛЬНЫЙ КОНТЕЙНЕР (ТОЛЬКО ДЛЯ ПРАВ НА ТОМА ДАННЫХ)
  # ---------------------------------------------------------------------------
  volume-init:
    image: alpine:${ALPINE_VERSION}
    container_name: vault-volume-init
    volumes:
      - vault-node1-data:/data1
      - vault-node2-data:/data2
      - vault-node3-data:/data3
    # Меняем владельца только у самих корневых папок
    command: chown -R 100:1000 /data1 /data2 /data3

  # ---------------------------------------------------------------------------
  # 2. ПЕРВАЯ НОДА КЛАСТЕРА HASHICORP VAULT
  # ---------------------------------------------------------------------------
  vault-node1:
    # Официальный образ HashiCorp Vault; версия берется из файла .env
    image: hashicorp/vault:${VAULT_VERSION}
    container_name: vault-node1
    # Управление порядком запуска контейнеров
    depends_on:
      cert-gen:
        # Ждать, пока cert-gen полностью выполнит скрипт и завершится без ошибок (код 0)
        condition: service_completed_successfully
      volume-init:
        # Ждать, пока init-контейнер выдаст права пользователю vault (100:1000) на тома данных
        condition: service_completed_successfully
    # Проброс портов: "порт_на_вашем_сервере:порт_внутри_контейнера"
    ports:
      - "18201:8200" # Веб-интерфейс и API первой ноды будут доступны по порту 18201
    # Подключение папок для хранения конфигурации, данных и сертификатов
    volumes:
      - ./node1/config:/vault/config       # Папка с готовым конфигом vault.hcl для первой ноды
      - vault-node1-data:/vault/data       # Постоянное хранилище данных Vault (чтобы не потерять секреты при перезапуске)
      - ./certs/vault1:/vault/certs:ro     # Папка с TLS-сертификатами конкретно для первой ноды (только чтение)
    # Расширенные системные привилегии Linux для контейнера
    cap_add:
      - IPC_LOCK # Запрещает ОС сбрасывать оперативную память Vault в файл подкачки (swap) на диск ради безопасности
    # Переменные окружения для работы самого Vault и его CLI-утилиты внутри контейнера
    environment:
      - VAULT_ADDR=https://vault1.${HOST_IP}.nip.io:8200 # Внешний HTTPS-адрес этой ноды через сервис nip.io
      - VAULT_CACERT=/vault/certs/ca.crt                 # Путь к корневому сертификату (CA), чтобы Vault доверял сам себе
    # Команда запуска сервера Vault с указанием пути к конфигурационному файлу
    command: vault server -config=/vault/config/vault.hcl
    # Настройки сети для этой ноды
    networks:
      vault-net:
        # Сетевые псевдонимы (алиасы), по которым другие контейнеры внутри сети могут обращаться к этой ноде
        aliases:
          - vault1.${HOST_IP}.nip.io

  # ---------------------------------------------------------------------------
  # 3. ВТОРАЯ НОДА КЛАСТЕРА HASHICORP VAULT
  # ---------------------------------------------------------------------------
  vault-node2:
    image: hashicorp/vault:${VAULT_VERSION}
    container_name: vault-node2
    depends_on:
      cert-gen:
        condition: service_completed_successfully # Также ждет успешного завершения генератора сертификатов
      volume-init:
        # Ждать, пока init-контейнер выдаст права пользователю vault (100:1000) на тома данных
        condition: service_completed_successfully
    ports:
      - "18202:8200" # Внешний порт изменен на 18202, чтобы не конфликтовать с первой нодой (внутри остается 8200)
    volumes:
      - ./node2/config:/vault/config
      - vault-node2-data:/vault/data
      - ./certs/vault2:/vault/certs:ro # Использует свой набор сертификатов для vault2
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://vault2.${HOST_IP}.nip.io:8200 # Адрес второй ноды
      - VAULT_CACERT=/vault/certs/ca.crt
    command: vault server -config=/vault/config/vault.hcl
    networks:
      vault-net:
        aliases:
          - vault2.${HOST_IP}.nip.io # Внутренний DNS-алиас для второй ноды

  # ---------------------------------------------------------------------------
  # 4. ТРЕТЬЯ НОДА КЛАСТЕРА HASHICORP VAULT
  # ---------------------------------------------------------------------------
  vault-node3:
    image: hashicorp/vault:${VAULT_VERSION}
    container_name: vault-node3
    depends_on:
      cert-gen:
        condition: service_completed_successfully # Также ждет успешного завершения генератора сертификатов
      volume-init:
        # Ждать, пока init-контейнер выдаст права пользователю vault (100:1000) на тома данных
        condition: service_completed_successfully
    ports:
      - "18203:8200" # Внешний порт изменен на 18203, чтобы не конфликтовать с первой и второй нодами
    volumes:
      - ./node3/config:/vault/config
      - vault-node3-data:/vault/data
      - ./certs/vault3:/vault/certs:ro # Использует свой набор сертификатов для vault3
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=https://vault3.${HOST_IP}.nip.io:8200 # Адрес третьей ноды
      - VAULT_CACERT=/vault/certs/ca.crt
    command: vault server -config=/vault/config/vault.hcl
    networks:
      vault-net:
        aliases:
          - vault3.${HOST_IP}.nip.io # Внутренний DNS-алиас для третьей ноды

  # ---------------------------------------------------------------------------
  # 5. БАЛАНСИРОВЩИК НАГРУЗКИ HAPROXY (Единая точка входа в кластер)
  # ---------------------------------------------------------------------------
  haproxy:
    # Официальный образ HAProxy; версия подставляется из файла .env (переменная HAPROXY_VERSION)
    image: haproxy:${HAPROXY_VERSION}
    # Фиксированное имя контейнера для удобства просмотра логов и управления
    container_name: vault-haproxy
    # Управление порядком запуска контейнеров
    depends_on:
      cert-gen:
        # Ждать, пока генератор сертификатов успешно завершит работу и создаст сертификат для HAProxy
        condition: service_completed_successfully
      vault-node1:
        # Ждать запуска контейнера первой ноды
        condition: service_started
      vault-node2:
        # Ждать запуска контейнера второй ноды
        condition: service_started
      vault-node3:
        # Ждать запуска контейнера третьей ноды
        condition: service_started
    # Проброс портов: "порт_на_вашем_сервере:порт_внутри_контейнера"
    ports:
      - "443:443" # Единая точка входа в кластер Vault (всегда перенаправляет трафик на активного лидера)
      - "8404:8404" # Веб-панель статистики HAProxy (для визуального мониторинга доступности нод)
    # Подключение файлов конфигурации и сертификатов с хоста внутрь контейнера (только для чтения)
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro # Конфигурация маршрутизации и health-check проверок нод
      - ./certs/haproxy:/usr/local/etc/haproxy/certs:ro             # Объединенный TLS-сертификат и приватный ключ для HTTPS
    # Настройки сети для балансировщика
    networks:
      vault-net:
        # Сетевой псевдоним, по которому контейнеры внутри сети могут обращаться к единой точке входа
        aliases:
          - vault.${HOST_IP}.nip.io

# ---------------------------------------------------------------------------
# СЕКЦИЯ НАСТРОЙКИ ИМЕНОВАННЫХ ТОМОВ (ДЛЯ ХРАНЕНИЯ ДАННЫХ RAFT)
# ---------------------------------------------------------------------------
volumes:
  vault-node1-data:
  vault-node2-data:
  vault-node3-data:

# ---------------------------------------------------------------------------
# СЕКЦИЯ НАСТРОЙКИ ВИРТУАЛЬНЫХ СЕТЕЙ
# ---------------------------------------------------------------------------
networks:
  vault-net:
    name: vault-cluster-net
    # Стандартный сетевой драйвер Docker (мост), изолирующий контейнеры проекта и позволяющий им общаться по именам/алиасам
    driver: bridge
